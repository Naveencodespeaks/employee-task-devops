# Local/"docker" environment: run the full 3-tier app with one command.
#
#   docker compose up -d --build
#   docker compose logs -f
#   docker compose ps
#   docker compose down          (add -v to also delete the postgres volume)

services:
  postgres:
    image: postgres:16-alpine
    container_name: employee-task-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-employee_task_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-in-real-environments}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    # Not exposing a "ports:" mapping to the host on purpose --
    # only containers on app-network (i.e. the backend) can reach Postgres.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-employee_task_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: employee-task-backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://postgres:change-me-in-real-environments@postgres:5432/employee_task_db}
      ENVIRONMENT: ${ENVIRONMENT:-docker}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    container_name: employee-task-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
