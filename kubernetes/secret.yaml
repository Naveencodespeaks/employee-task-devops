# PLACEHOLDER ONLY -- do not commit real secrets to Git.
#
# In real usage, create this with `kubectl create secret generic` from
# environment variables or a secrets manager (AWS Secrets Manager +
# External Secrets Operator, Sealed Secrets, SOPS, etc.) instead of
# committing a populated version of this file.
#
# Example (imperative, not stored in Git):
#   kubectl create secret generic employee-task-secrets \
#     --namespace employee-task \
#     --from-literal=POSTGRES_USER=postgres \
#     --from-literal=POSTGRES_PASSWORD=<real-password> \
#     --from-literal=DATABASE_URL=postgresql+psycopg2://postgres:<real-password>@postgres:5432/employee_task_db
apiVersion: v1
kind: Secret
metadata:
  name: employee-task-secrets
  namespace: employee-task
type: Opaque
stringData:
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "REPLACE_ME"
  DATABASE_URL: "postgresql+psycopg2://postgres:REPLACE_ME@postgres:5432/employee_task_db"
