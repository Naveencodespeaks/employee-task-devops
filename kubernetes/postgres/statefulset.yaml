# A StatefulSet (not a Deployment) is used for Postgres because it needs
# a stable identity and its own persistent volume. In a real AWS/EKS
# setup you would normally point at RDS instead of running Postgres in
# the cluster at all -- this manifest exists so the app is fully
# runnable on a local cluster (minikube/kind) for Phase 16 of the
# learning path, before EKS + RDS in later phases.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: employee-task
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          envFrom:
            - configMapRef:
                name: employee-task-config
            - secretRef:
                name: employee-task-secrets
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 5
            periodSeconds: 5
  volumeClaimTemplates:
    - metadata:
        name: postgres-storage
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
