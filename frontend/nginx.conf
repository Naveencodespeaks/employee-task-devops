server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: any unknown path serves index.html so React Router
    # handles client-side routing instead of Nginx returning 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Basic health check path for the ALB / container orchestrator.
    location /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
